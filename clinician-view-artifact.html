<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clinician View V3 — PatientPass Prototype</title>
<!-- Self-contained prototype. No build step, no npm/Leyden deps.
     React + Babel are loaded from a CDN so the file runs by double-click or as a Claude artifact.
     Everything else (markup, styles, data, icons, logo) is inline and editable below. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" crossorigin></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Helvetica Neue", Arial, "Segoe UI", system-ui, sans-serif;
    color: #2e2e2e;
    background: #fff;
  }

  :root {
    --cv-orange: #e9711c;
    --cv-teal: #007398;
    --cv-teal-dark: #005f7e;
    --cv-green: #158509;
    --cv-red: #c63527;
    --cv-text: #2e2e2e;
    --cv-muted: #737373;
    --cv-border: #d9dde1;
    --cv-filter-bg: #eaf2fb;
    --cv-page-max: 1200px;
  }

  /* Inline icons inherit color via currentColor; specific fills below override. */
  .cv-icon { display: inline-block; fill: currentColor; color: #5e6373; flex: none; vertical-align: middle; }

  .cv-page { min-height: 100vh; display: flex; flex-direction: column; background: #fff; color: var(--cv-text); }

  /* ---------- Header ---------- */
  .cv-header { border-bottom: 1px solid var(--cv-border); background: #fff; }
  .cv-header__inner { max-width: var(--cv-page-max); margin: 0 auto; height: 80px; display: flex; align-items: center; gap: 2rem; padding: 0 1.5rem; }
  .cv-logo { border: 0; background: none; cursor: pointer; padding: 0; display: inline-flex; align-items: center; }
  .cv-logo__img { height: 26px; width: auto; display: block; }
  .cv-search { display: flex; flex: 1; max-width: 420px; height: 44px; border: 1px solid var(--cv-border); border-radius: 2px; }
  .cv-search__input { flex: 1; border: 0; padding: 0 0.9rem; font-size: 0.95rem; outline: none; background: transparent; }
  .cv-search__btn { width: 48px; border: 0; background: var(--cv-teal); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .cv-search__btn .cv-icon { fill: #fff; color: #fff; }
  .cv-nav { display: flex; align-items: center; gap: 1.75rem; margin-left: auto; }
  .cv-nav__link { text-decoration: none; color: var(--cv-text); font-size: 1rem; padding-bottom: 2px; border-bottom: 3px solid transparent; background: none; border-top: 0; border-left: 0; border-right: 0; cursor: pointer; font-family: inherit; }
  .cv-nav__link.is-active { border-bottom-color: var(--cv-orange); font-weight: 600; }
  .cv-nav__cart { border: 0; background: none; cursor: pointer; display: flex; align-items: center; }
  .cv-nav__cart .cv-icon { color: var(--cv-teal); }

  /* ---------- Links ---------- */
  .cv-link { color: var(--cv-teal); text-decoration: none; cursor: pointer; }
  .cv-link:hover { text-decoration: underline; }
  .cv-link--deleted { color: var(--cv-red); }

  /* ---------- Homescreen layout ---------- */
  .cv-home { flex: 1; width: 100%; max-width: var(--cv-page-max); margin: 0 auto; display: flex; align-items: stretch; }
  .cv-sidebar { width: 256px; flex: none; border-right: 1px solid var(--cv-border); padding: 1.25rem 1.5rem; background: #fafbfc; }
  .cv-sidebar__head { display: flex; align-items: center; gap: 0.4rem; font-weight: 700; margin-bottom: 1.25rem; }
  .cv-context-group { border-top: 1px solid var(--cv-border); padding: 0.4rem 0; }
  .cv-context-group:first-of-type { border-top: 0; }
  .cv-context-group__toggle { width: 100%; display: flex; align-items: center; gap: 0.5rem; background: none; border: 0; cursor: pointer; padding: 0.5rem 0; font-size: 0.95rem; color: var(--cv-text); font-family: inherit; }
  .cv-context-group__label { font-weight: 600; }
  .cv-context-group__toggle .cv-icon:last-child { margin-left: auto; }
  .cv-context-group__items { list-style: none; margin: 0.25rem 0 0.5rem; padding: 0; display: flex; flex-direction: column; gap: 0.55rem; }
  .cv-context-link { color: var(--cv-text); text-decoration: none; font-size: 0.92rem; }
  .cv-context-link.is-active { color: var(--cv-text); font-weight: 600; border-bottom: 2px solid var(--cv-orange); padding-bottom: 1px; }
  .cv-context-link:hover { color: var(--cv-teal); }
  .cv-home__content { flex: 1; min-width: 0; }

  /* count pill */
  .cv-pill { display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 20px; padding: 0 7px; border-radius: 999px; background: var(--cv-teal); color: #fff; font-size: 0.78rem; font-weight: 700; }

  /* ---------- Filters bar ---------- */
  .cv-filters { background: var(--cv-filter-bg); padding: 0.85rem 1.5rem 1rem; }
  .cv-filters__row { display: flex; align-items: center; gap: 1.25rem; }
  .cv-filters__label { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.9rem; }
  .cv-filters__clear { margin-left: auto; }
  .cv-filters__checks { display: flex; flex-wrap: wrap; gap: 1.25rem; margin: 0.6rem 0 0.75rem; }
  .cv-check { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.9rem; cursor: pointer; }
  .cv-check input { width: 16px; height: 16px; accent-color: var(--cv-teal); }
  .cv-filters__patient { display: flex; align-items: center; gap: 0.6rem; font-size: 0.9rem; }
  .cv-filters__chip { display: inline-flex; align-items: center; gap: 0.3rem; background: #fff; border: 1px solid var(--cv-border); border-radius: 2px; padding: 0.2rem 0.5rem; }

  /* ---------- Results / table ---------- */
  .cv-home__results { padding: 1.5rem; }
  .cv-results-summary { margin: 0 0 1.25rem; font-size: 0.95rem; }
  .cv-table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
  .cv-table thead th { text-align: left; font-weight: 600; color: var(--cv-muted); padding: 0 0.75rem 0.85rem; vertical-align: bottom; border-bottom: 2px solid #c4cad1; }
  .cv-table tbody td { padding: 0.85rem 0.75rem; border-bottom: 1px solid var(--cv-border); vertical-align: middle; }
  .cv-table__col-fav { width: 44px; }
  .cv-table__col-shared { white-space: nowrap; width: 120px; }
  .cv-table__col-lang { width: 120px; }
  .cv-table__col-actions { width: 150px; }
  .cv-table__col-add { width: 90px; text-align: center; }
  .cv-table__actions-head { display: inline-flex; align-items: center; gap: 0.3rem; }
  .cv-table__actions-sub { font-weight: 400; }
  .cv-lang { display: inline-flex; align-items: center; gap: 0.3rem; color: var(--cv-text); }

  /* ---------- Favorite stars ---------- */
  .cv-fav { display: inline-flex; align-items: center; justify-content: center; }
  .cv-fav--favorite .cv-icon, .cv-fav--none .cv-icon, .cv-fav--org .cv-icon { fill: var(--cv-teal); color: var(--cv-teal); }
  .cv-fav--org { width: 28px; height: 28px; border: 2px dashed var(--cv-orange); border-radius: 50%; }

  /* ---------- Quick actions + add ---------- */
  .cv-quick-actions { display: inline-flex; gap: 1.1rem; }
  .cv-quick-actions .cv-icon { color: var(--cv-teal); }
  .cv-icon-btn { border: 0; background: none; cursor: pointer; padding: 0.2rem; display: inline-flex; align-items: center; justify-content: center; }
  .cv-icon-btn:hover .cv-icon { opacity: 0.7; }
  .cv-add-btn { width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--cv-teal); color: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .cv-add-btn .cv-icon { fill: #fff; color: #fff; }
  .cv-add-btn:hover { background: var(--cv-teal-dark); }

  /* ---------- Pagination ---------- */
  .cv-pagination { display: flex; align-items: center; gap: 0.5rem; margin-top: 2rem; font-size: 0.95rem; }
  .cv-pagination button { border: 0; background: none; cursor: pointer; color: var(--cv-teal); display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.35rem 0.5rem; font-family: inherit; font-size: 0.95rem; }
  .cv-pagination button:disabled { color: var(--cv-muted); cursor: default; }
  .cv-pagination button:disabled .cv-icon { color: var(--cv-muted); }
  .cv-pagination__page { min-width: 28px; justify-content: center; }
  .cv-pagination__page.is-active { color: var(--cv-text); font-weight: 700; border-bottom: 2px solid var(--cv-orange); }

  /* ---------- My Favorites ---------- */
  .cv-favorites { flex: 1; width: 100%; max-width: var(--cv-page-max); margin: 0 auto; padding: 2rem 1.5rem 3rem; }
  .cv-favorites__title { font-size: 2.25rem; font-weight: 700; margin: 0 0 1.5rem; }
  .cv-favorites__columns { display: grid; grid-template-columns: 1fr 1px 1fr; gap: 2rem; align-items: start; }
  .cv-favorites__divider { background: var(--cv-border); align-self: stretch; }
  .cv-favorites__heading { font-size: 1.4rem; font-weight: 700; margin: 0 0 0.75rem; }

  /* ---------- Education History ---------- */
  .cv-history { flex: 1; width: 100%; max-width: var(--cv-page-max); margin: 0 auto; padding: 2rem 1.5rem 3rem; }
  .cv-history__title { font-size: 1.9rem; font-weight: 400; margin: 0 0 1.75rem; }
  .cv-history__title strong { font-weight: 700; }
  .cv-history-table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
  .cv-history-table thead th { text-align: left; color: var(--cv-muted); font-weight: 600; padding: 0.5rem 1rem 0.85rem; border-bottom: 2px solid #c4cad1; }
  .cv-history-table tbody td { padding: 1rem; border-bottom: 1px solid var(--cv-border); vertical-align: top; }
  .cv-history-table__date { white-space: nowrap; width: 130px; }
  .cv-sortable, .cv-th-info { display: inline-flex; align-items: center; gap: 0.3rem; color: var(--cv-teal); }
  .cv-th-info { color: var(--cv-muted); }
  .cv-history-titles { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.85rem; }
  .cv-history-titles li { display: flex; align-items: center; gap: 0.45rem; }
  .cv-history-lang { color: var(--cv-muted); }
  .cv-delivery-deleted { display: flex; align-items: center; gap: 0.35rem; color: var(--cv-red); font-style: italic; font-weight: 600; margin-bottom: 0.35rem; }
  .cv-delivery-deleted .cv-icon { color: var(--cv-red); }
  .cv-delivery-method { display: block; }

  /* status dots */
  .cv-status-dot { width: 16px; height: 16px; border-radius: 50%; flex: none; }
  .cv-status-dot--not-started { border: 2px solid var(--cv-muted); }
  .cv-status-dot--in-progress { border: 2px solid var(--cv-teal); background: linear-gradient(90deg, var(--cv-teal) 50%, #fff 50%); }
  .cv-status-dot--completed { background: var(--cv-green); }
  .cv-status-dot--deleted { border: 2px solid var(--cv-red); background: var(--cv-red); }

  /* progress badges */
  .cv-progress { display: inline-block; padding: 0.35rem 1rem; border-radius: 999px; font-size: 0.85rem; font-weight: 600; white-space: nowrap; }
  .cv-progress--none { border: 1px solid var(--cv-muted); color: var(--cv-text); background: #fff; }
  .cv-progress--in-progress { background: var(--cv-teal); color: #fff; }
  .cv-progress--completed { background: var(--cv-green); color: #fff; }
  .cv-progress--deleted { background: var(--cv-red); color: #fff; }

  /* ---------- Footer ---------- */
  .cv-footer { border-top: 3px solid var(--cv-orange); margin-top: auto; }
  .cv-footer__inner { max-width: var(--cv-page-max); margin: 0 auto; padding: 1.5rem; display: flex; gap: 1.5rem; align-items: flex-start; font-size: 0.8rem; color: var(--cv-muted); }
  .cv-footer__brand, .cv-footer__relx { font-weight: 700; color: var(--cv-orange); white-space: nowrap; }
  .cv-footer__relx { margin-left: auto; }
  .cv-footer__content { flex: 1; }
  .cv-footer__links { display: flex; flex-wrap: wrap; gap: 1.5rem; margin-bottom: 0.75rem; }
  .cv-footer__links a { color: var(--cv-text); text-decoration: none; }
  .cv-footer__links a:hover { text-decoration: underline; }
  .cv-footer__copy { margin: 0; line-height: 1.5; }

  /* ---------- Toast ---------- */
  .cv-toast-region { position: fixed; right: 1.5rem; bottom: 1.5rem; z-index: 1000; display: flex; flex-direction: column; gap: 0.75rem; max-width: 380px; }
  .cv-toast { display: flex; align-items: center; gap: 1rem; background: #fff; border: 1px solid var(--cv-border); border-top: 4px solid var(--cv-green); padding: 1rem 1.25rem; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12); border-radius: 2px; animation: cv-toast-in 0.2s ease-out; }
  .cv-toast--error { border-top-color: var(--cv-red); }
  .cv-toast__message { flex: 1; font-size: 0.95rem; color: var(--cv-text); }
  .cv-toast__close { border: 0; background: none; cursor: pointer; display: inline-flex; padding: 0.2rem; }
  .cv-toast__close .cv-icon { fill: var(--cv-teal); color: var(--cv-teal); }
  @keyframes cv-toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* ---------- Modal (replaces Leyden Modal) ---------- */
  .cv-modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); display: flex; align-items: center; justify-content: center; z-index: 900; padding: 1rem; }
  .cv-modal { background: #fff; border-radius: 4px; border-top: 4px solid var(--cv-orange); max-width: 80vw; max-height: 92vh; overflow: auto; padding: 1.5rem 1.75rem 1.75rem; position: relative; box-shadow: 0 10px 36px rgba(0, 0, 0, 0.28); }
  .cv-modal__close { position: absolute; top: 0.85rem; right: 0.85rem; border: 1px solid var(--cv-teal); border-radius: 4px; background: none; cursor: pointer; display: inline-flex; padding: 0.2rem; }
  .cv-modal__close .cv-icon { fill: var(--cv-teal); color: var(--cv-teal); width: 20px; height: 20px; }

  /* ---------- Print modal ---------- */
  .cv-print-modal__body { width: 720px; max-width: 76vw; display: flex; flex-direction: column; gap: 0.75rem; }
  .cv-print-modal__title { font-size: 1.4rem; font-weight: 700; margin: 0; }
  .cv-print-modal__subtitle { margin: 0; color: var(--cv-muted); }
  .cv-print-modal__preview { width: 100%; height: 56vh; border: 1px solid var(--cv-border); background: #525659; }
  .cv-print-modal__actions { display: flex; justify-content: flex-end; gap: 0.75rem; }

  /* buttons (replace Leyden Button) */
  .cv-btn { font-family: inherit; font-size: 0.95rem; font-weight: 600; padding: 0.55rem 1.4rem; border-radius: 4px; cursor: pointer; border: 1px solid var(--cv-teal); }
  .cv-btn--primary { background: var(--cv-teal); color: #fff; }
  .cv-btn--primary:hover { background: var(--cv-teal-dark); }
  .cv-btn--secondary { background: #fff; color: var(--cv-teal); }
  .cv-btn--secondary:hover { background: #f0f6f8; }

  @media (max-width: 960px) {
    .cv-home { flex-direction: column; }
    .cv-sidebar { width: 100%; border-right: 0; border-bottom: 1px solid var(--cv-border); }
    .cv-favorites__columns { grid-template-columns: 1fr; }
    .cv-favorites__divider { display: none; }
  }
</style>
</head>

/* =====================================================================
   TOAST
   ===================================================================== */
const ToastContext = createContext(null);
const useToast = () => useContext(ToastContext);

function ToastProvider({ children }) {
  const [toasts, setToasts] = useState([]);
  const nextId = useRef(0);
  const dismiss = useCallback((id) => setToasts((cur) => cur.filter((t) => t.id !== id)), []);
  const showToast = useCallback((message, variant = 'success') => {
    const id = nextId.current++;
    setToasts((cur) => [...cur, { id, message, variant }]);
    window.setTimeout(() => dismiss(id), 5000);
  }, [dismiss]);
  return (
    <ToastContext.Provider value={{ showToast }}>
      {children}
      <div className="cv-toast-region" role="region" aria-live="polite" aria-label="Notifications">
        {toasts.map((t) => (
          <div key={t.id} className={`cv-toast cv-toast--${t.variant}`} role="status">
            <span className="cv-toast__message">{t.message}</span>
            <button type="button" className="cv-toast__close" aria-label="Dismiss notification" onClick={() => dismiss(t.id)}>
              <Icon sprite="CLOSE" size="XS" />
            </button>
          </div>
        ))}
      </div>
    </ToastContext.Provider>
  );
}

function docHtml(title) {
  return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${title}</title>
  <style>
    body { font-family: Georgia, "Times New Roman", serif; color:#222; margin:0; padding:48px 56px; line-height:1.5; }
    .doc-head { border-bottom:3px solid #e9711c; padding-bottom:12px; margin-bottom:24px; display:flex; justify-content:space-between; align-items:baseline; }
    .doc-brand { color:#e9711c; font-weight:bold; font-family:Arial,sans-serif; letter-spacing:.5px; }
    h1 { font-size:24px; margin:0 0 4px; }
    .sub { color:#666; font-family:Arial,sans-serif; font-size:13px; margin-bottom:24px; }
    h2 { font-size:16px; margin:22px 0 6px; color:#005f7e; font-family:Arial,sans-serif; }
    p { margin:0 0 12px; }
    ul { margin:0 0 12px 20px; }
    .foot { margin-top:36px; border-top:1px solid #ccc; padding-top:10px; color:#888; font-size:11px; font-family:Arial,sans-serif; }
  </style></head><body>
    <div class="doc-head"><span class="doc-brand">PatientPass&reg;</span><span style="font-family:Arial,sans-serif;font-size:12px;color:#888;">Patient Education</span></div>
    <h1>${title}</h1>
    <div class="sub">Prepared for ${PATIENT_NAME} &middot; Reviewed by your care team</div>
    <h2>Overview</h2>
    <p>This handout explains what you need to know about your condition and care. Read it with your care team and ask questions about anything you do not understand. Keep this sheet for your records.</p>
    <h2>What to expect</h2>
    <p>Your care team will guide you through each step. Follow the instructions below and take any medications exactly as prescribed.</p>
    <ul>
      <li>Take all medications as directed by your provider.</li>
      <li>Attend every scheduled follow-up appointment.</li>
      <li>Track your symptoms and note any changes.</li>
      <li>Maintain a balanced diet and stay hydrated.</li>
    </ul>
    <h2>When to call your provider</h2>
    <p>Contact your care team right away if you have a fever, increased pain, swelling, or any symptom that worsens or does not improve.</p>
    <div class="foot">&copy; 2026 Elsevier Inc. This material is for educational purposes and is not a substitute for professional medical advice.</div>
  </body></html>`;
}

function PrintModal({ title, onClose }) {
  const frameRef = useRef(null);
  const handlePrint = () => {
    const frame = frameRef.current;
    if (frame && frame.contentWindow) {
      frame.contentWindow.focus();
      frame.contentWindow.print();
    }
  };
  return (
    <div className="cv-modal-overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="cv-modal" role="dialog" aria-modal="true" aria-label={`Print ${title}`}>
        <button type="button" className="cv-modal__close" aria-label="Close modal" onClick={onClose}><Icon sprite="CLOSE" size="S" /></button>
        <div className="cv-print-modal__body">
          <h2 className="cv-print-modal__title">Print education</h2>
          <p className="cv-print-modal__subtitle">{title}</p>
          <iframe ref={frameRef} className="cv-print-modal__preview" title={`Preview of ${title}`} srcDoc={docHtml(title)} />
          <div className="cv-print-modal__actions">
            <button type="button" className="cv-btn cv-btn--secondary" onClick={onClose}>Cancel</button>
            <button type="button" className="cv-btn cv-btn--primary" onClick={handlePrint}>Print</button>
          </div>
        </div>
      </div>
    </div>
  );
}

            <ul className="cv-context-group__items">
              {group.items.map((item) => (
                <li key={item}><a href="#" className={`cv-context-link${item === group.active ? ' is-active' : ''}`} onClick={(e) => e.preventDefault()}>{item}</a></li>
              ))}
            </ul>
          )}
        </div>
      ))}
    </aside>
  );
}

function FiltersBar() {
  return (
    <div className="cv-filters">
      <div className="cv-filters__row">
        <span className="cv-filters__label">Education filters- <strong>show only:</strong><Icon sprite="INFORMATION_OUTLINE_CIRCLE" size="XS" /></span>
        <a href="#" className="cv-link" onClick={(e) => e.preventDefault()}>Save as default</a>
        <a href="#" className="cv-link cv-filters__clear" onClick={(e) => e.preventDefault()}>Clear all</a>
      </div>
      <div className="cv-filters__checks">
        {SHOW_ONLY.map((opt) => (
          <label key={opt.label} className="cv-check"><input type="checkbox" /><span>{opt.label}</span>{opt.icon && <Icon sprite={opt.icon} size="XS" />}</label>
        ))}
      </div>
      <div className="cv-filters__patient">
        Patient filters for <strong>{PATIENT_NAME}:</strong>
        <span className="cv-filters__chip">Female <Icon sprite="CHEVRON_DOWN" size="XS" /></span>
        <span className="cv-filters__chip">Aged (56 to 79 years) <Icon sprite="CHEVRON_DOWN" size="XS" /></span>
      </div>
    </div>
  );
}

function HomePagination() {
  return (
    <nav className="cv-pagination" aria-label="Pagination">
      <button type="button" className="cv-pagination__edge" aria-label="First page" disabled><Icon sprite="CHEVRON_LEFT" size="XS" /><Icon sprite="CHEVRON_LEFT" size="XS" /></button>
      <button type="button" className="cv-pagination__nav" disabled><Icon sprite="CHEVRON_LEFT" size="XS" /> Previous</button>
      <button type="button" className="cv-pagination__page is-active">1</button>
      <button type="button" className="cv-pagination__page">2</button>
      <button type="button" className="cv-pagination__page">3</button>
      <button type="button" className="cv-pagination__nav">Next <Icon sprite="CHEVRON_RIGHT" size="XS" /></button>
      <button type="button" className="cv-pagination__edge" aria-label="Last page"><Icon sprite="CHEVRON_RIGHT" size="XS" /><Icon sprite="CHEVRON_RIGHT" size="XS" /></button>
    </nav>
  );
}

function Homescreen({ onPrint }) {
  return (
    <div className="cv-home">
      <Sidebar />
      <main className="cv-home__content">
        <FiltersBar />
        <div className="cv-home__results">
          <p className="cv-results-summary">Search results 1-10 of 30 for <strong>"Kidney Transplant, Optimal Coping with Organ Transplant"</strong></p>
          <EducationTable rows={EDUCATION_ROWS} showLastShared onPrint={onPrint} />
          <HomePagination />
        </div>
      </main>
    </div>
  );
}

function MyFavorites({ onPrint }) {
  return (
    <main className="cv-favorites">
      <h1 className="cv-favorites__title">My Favorites</h1>
      <div className="cv-favorites__columns">
        <section className="cv-favorites__col">
          <h2 className="cv-favorites__heading">Documents</h2>
          <EducationTable rows={FAVORITES_LEFT} onPrint={onPrint} />
        </section>
        <div className="cv-favorites__divider" aria-hidden="true" />
        <section className="cv-favorites__col">
          <h2 className="cv-favorites__heading">Documents</h2>
          <EducationTable rows={FAVORITES_RIGHT} onPrint={onPrint} />
        </section>
      </div>
    </main>
  );
}

function HistoryPagination() {
  return (
    <nav className="cv-pagination" aria-label="Pagination">
      <button type="button" className="cv-pagination__nav" disabled><Icon sprite="CHEVRON_LEFT" size="XS" /> Previous</button>
      {[1, 2, 3, 4, 5].map((p) => (<button key={p} type="button" className={`cv-pagination__page${p === 1 ? ' is-active' : ''}`}>{p}</button>))}
      <button type="button" className="cv-pagination__nav">Next <Icon sprite="CHEVRON_RIGHT" size="XS" /></button>
    </nav>
  );
}

function EducationHistory() {
  return (
    <main className="cv-history">
      <h1 className="cv-history__title">Patient Education History for <strong>{HISTORY_PATIENT_NAME}</strong></h1>
      <table className="cv-history-table">
        <thead>
          <tr>
            <th className="cv-history-table__date"><span className="cv-sortable">Date shared <Icon sprite="CHEVRON_DOWN" size="XS" /></span></th>
            <th><span className="cv-th-info">Title <Icon sprite="INFORMATION_OUTLINE_CIRCLE" size="XS" /></span></th>
            <th>Delivery method</th>
            <th>Patient progress</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          {HISTORY_ROWS.map((row) => (
            <tr key={row.id}>
              <td className="cv-history-table__date">{row.dateShared}</td>
              <td>
                <ul className="cv-history-titles">
                  {row.titles.map((t, i) => (
                    <li key={i}>
                      <span className={`cv-status-dot cv-status-dot--${t.status}`} aria-hidden="true" />
                      <a href="#" className={`cv-link${t.status === 'deleted' ? ' cv-link--deleted' : ''}`} onClick={(e) => e.preventDefault()}>{t.text}</a>
                      <span className="cv-history-lang">({t.language})</span>
                      {t.hasVideo && <Icon sprite="VIDEO_CAMERA" size="XS" />}
                    </li>
                  ))}
                </ul>
              </td>
              <td>
                {row.deliveryDeleted && (<span className="cv-delivery-deleted"><Icon sprite="EYE_NOT_VISIBLE" size="XS" />Assignment deleted</span>)}
                <span className="cv-delivery-method">{row.deliveryMethod}</span>
              </td>
              <td><span className={`cv-progress cv-progress--${row.progress}`}>{PROGRESS_LABEL[row.progress]}</span></td>
              <td><button type="button" className="cv-icon-btn" aria-label="More actions"><Icon sprite="ELLIPSIS" size="S" /></button></td>
            </tr>
          ))}
        </tbody>
      </table>
      <HistoryPagination />
    </main>
  );
}

/* =====================================================================
   APP
   ===================================================================== */
function App() {
  const [page, setPage] = useState('home');
  const [printTitle, setPrintTitle] = useState(null);
  return (
    <ToastProvider>
      <div className="cv-page">
        <ClinicianHeader page={page} onNavigate={(p) => { setPrintTitle(null); setPage(p); }} />
        {page === 'home' && <Homescreen onPrint={setPrintTitle} />}
        {page === 'favorites' && <MyFavorites onPrint={setPrintTitle} />}
        {page === 'history' && <EducationHistory />}
        <Footer />
        {printTitle && <PrintModal title={printTitle} onClose={() => setPrintTitle(null)} />}
      </div>
    </ToastProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
